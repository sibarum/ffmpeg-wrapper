# Calls into native code through java.lang.foreign: the image needs the Foreign Function & Memory API, shared arenas,
# and native access for code on the classpath. Picked up by native-image from any jar that carries this file.
#
# The libraries themselves are not resources of the image: about 125 MB of FFmpeg would be embedded in the executable
# and extracted again at every run. A native application ships them in an "ffmpeg" folder beside its executable,
# where NativeLib looks first.
Args = -H:+UnlockExperimentalVMOptions -H:+ForeignAPISupport -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions \
       --enable-native-access=ALL-UNNAMED
